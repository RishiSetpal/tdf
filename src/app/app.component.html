<!-- div.container-fluid -->
<div class="container-fluid">
  <h1>Bootcamp Enrollment Form</h1>
  <!-- 
    Template Refernce Varible using #userForm 
    Assign string "ngForm" to userForm variable
    
    Now, we have Reference to the deractive ngForm
    which is provided by FormsModule

    Directive gives the access to the values of the form Controls
    and the overall form state (valid/invalid, pristine/dirty, etc.)
    -->

  <!-- 
    // Property Binding -> Data Moves from Class to View 
    using [ngModel]="userModel.timePrefernce" 
    Two way Binding can be done using banana in a box syntax. // banana meaning () and box meaning []
    ie. 
    [(ngModel)]="userModel.timePrefernce"
    ie. Model and View in Sinchronization
    -->
  <form #userForm="ngForm"> <!-- form automatically attcahes ngForm directive to the form tag (#userForm template Reference variable) -->
    UserForm: {{ userForm.value | json }}
    <hr />
    userModel: {{ userModel | json }}
    <hr />
    <!-- userForm.form.valid: {{userForm.form.valid}}
    userForm.valid: {{userForm.valid}}
    userForm.form.invalid: {{userForm.form.invalid}}
    userForm.invalid: {{userForm.invalid}} -->

    <!-- Text | email | tel -->
    <!-- form-group & form-control are BootStrap Classes-->


    <p>Basic Details:</p>
    <div class="form-group">
      <label>Name</label>
      <!--#userName                     --is-- Template Refernce Varible -->
      <!-- <hr />
          {{ userName.value }}
          <hr />
          {{ userName.className }}
          <hr />
          {{userName.classList}}<hr> -->
      <!--[(ngModel)]="userModel.name"  --is-- Two Way Data Binding -->
      <!--name                          --is-- Field Name on which FormControl is Binds Data to NgForm-->

      <!-- #userName="ngModel" - This will help us access/ the ngModel directive's properties -->
      <!-- {{userName.untouched}} - This will show that it was touched or not -->
      <input #userName="ngModel" type="text" class="form-control"
        [class.is-invalid]="userName.invalid && (userName.touched || userName.dirty)" [(ngModel)]="userModel.name"
        required name="userName" />
      <!-- [ngClass]="userName.invalid && userName.touched ? 'is-invalid' : ''" -->
      <small [class.d-none]="userName.valid || (userName.untouched && userName.pristine)" class="invalid-feedback">User
        Name is Required.</small>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input #email type="email" class="form-control" [(ngModel)]="userModel.email" name="email" />
    </div>
    <!-- This mapping of ngModel to phone, #phone="ngModel" helps to access the ngModel directive's properties -->
    <div class="form-group mb-3">
      <label>Phone</label>
      <input #phone="ngModel" type="tel" class="form-control" ngClass="phone.invalid ? ''"
        [ngClass]="phone.invalid && phone.touched ? 'is-invalid' : ''" [(ngModel)]="userModel.phone" required
        pattern="^\d{10}$" name="phone" />
      <!-- <div *ngIf="phone.errors?.['required']" class="invalid-feedback">Phone no is Required</div>
      <div *ngIf="phone.invalid" class="invalid-feedback">Please enter a valid 10-digit phone number.</div> -->

      <!-- <small [class.d-none]="phone.valid || phone.untouched" class="invalid-feedback">Phone number must be 10 digits.</small> -->
      <div *ngIf="phone.errors && (phone.touched || phone.dirty)">

        <small *ngIf="phone.errors['required']" class="text-danger">Phone no is Required</small>
        <small *ngIf="phone.errors['pattern']" class="text-danger">Please enter a valid 10-digit phone number.</small>
      </div>
    </div>

    <!-- NgModal Group Directive -->
    <div ngModelGroup="address" class="mb-3">
      Address:
      <div class="form-group">
        <label>Street</label>
        <input #street type="text" class="form-control" [(ngModel)]="userModel.address.street" name="street" />
      </div>
      <div class="form-group">
        <label>City</label>
        <input #city type="text" class="form-control" [(ngModel)]="userModel.address.city" name="city" />
      </div>
      <div class="form-group">
        <label>Zip Code</label>
        <input #zipCode type="text" class="form-control" [(ngModel)]="userModel.address.zipCode" name="zipCode" />
      </div>
    </div>

    <!-- Select Dropdown -->
    <div class="form-group mb-3">
      <!-- form-select BootStrap 5 class and Above -->
      <!-- custom-select BootStrap 4 class -->
      <select (blur)="validateTopic(topic.value)" (change)="validateTopic()" class="form-select" #topic="ngModel"
        [class.is-invalid]="!isTopicInvalid && topic.touched" [(ngModel)]="userModel.topic" name="topic">
        <option selected [value]="null">I am interseted in</option>
        <option *ngFor="let topic of topics" [value]="topic">
          {{ topic }}
        </option>
      </select>
      <small [class.d-none]="isTopicInvalid || (topic.untouched && topic.pristine)" class="invalid-feedback">Topic is
        Required.</small>
    </div>

    <!-- Radio Button -->
    <div class="form-group mb-3">
      <label>Time Preference</label>
      <!-- form-check & form-check-input -->
      <div class="form-check">
        <input type="radio" class="form-check-input" name="timePreference" value="morning"
          [(ngModel)]="userModel.timePrefernce" />
        <label class="form-check-label">Morning (9AM -12Am)</label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" name="timePreference" value="evening"
          [(ngModel)]="userModel.timePrefernce" />
        <label class="form-check-label">Afternoon (12PM - 5PM)</label>
      </div>
    </div>

    <!-- Checkbox -->
    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" [(ngModel)]="userModel.subscribe" name="subscribe" />
      <label class="form-check-label">Send me Promotional Offers</label>
    </div>

    <!-- [PropertyBinding] -->
    <button [disabled]="userForm.invalid || isTopicInvalid" class="btn btn-primary" type="submit" >Summary Form</button>
  </form>
</div>

<!-- 
  In Template Driven From 
  We have 3 Directives
  1. ngModel
  2. ngForm
  3. ngModelGroup
-->
<!-- 
  ngModel Directive 
  Used for two way Data Binding
  Binds the form control to a property on the component
  Example: [(ngModel)]="userModel.name"
  
  ngForm Directive
  Applied to the <form> element
  Creates a FormGroup instance that represents the entire form
  Provides access to the form's overall state and values

  ngModelGroup Directive
  Used to group related form controls together
  Creates a nested FormGroup within the main FormGroup
  Example: <div ngModelGroup="address">
-->

<!-- 
  Track control state and Validity (Classes added to form controls)

  state: touched/untouched, pristine/dirty (value Changed), valid/invalid(required, pattern etc.),
    
    control has been focused and blurred    True          False
                                            ng-touched    ng-untouched

    control's value has been modified       True          False
                                            ng-dirty      ng-pristine

    control's value has valid value         True          False
                                            ng-valid      ng-invalid
                                          
  validity: required, minlength, maxlength, pattern etc.  
-->
